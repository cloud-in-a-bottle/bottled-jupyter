# Shared proxy directives for the JupyterLab upstream.
#
# The OpenHost router strips the original Host header, so Jupyter
# sees Host: 127.0.0.1:8080.  We forward the real external host via
# X-Forwarded-Host and rely on ServerApp.allow_remote_access +
# disabled host-check (set in start.sh) so Jupyter accepts it.

proxy_http_version 1.1;

# WebSocket upgrade (kernels, terminals, the /api/kernels/*/channels
# socket).  $connection_upgrade is "upgrade" when the client sends an
# Upgrade header, else "close".
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Pass the external-facing host + scheme through to Jupyter.
proxy_set_header Host              $http_x_forwarded_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;

# Don't buffer streaming responses (kernel output, long polls).
proxy_buffering off;
