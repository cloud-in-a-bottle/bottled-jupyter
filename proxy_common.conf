# Shared proxy directives for the JupyterLab upstream.
#
# The router strips the original Host header, so Jupyter sees
# Host: 127.0.0.1:8080.  We forward the real external host via
# X-Forwarded-Host and rely on ServerApp.allow_remote_access +
# disabled host-check (set in start.sh) so Jupyter accepts it.
#
# $forwarded_host / $forwarded_proto are defined in nginx.conf.tmpl and
# fall back to this hop's own Host / to https when the router's headers
# are absent (a direct probe to :8080).  The scheme in particular must
# be passed through rather than hardcoded: Jupyter marks its session
# cookie Secure when it believes the request was https, and on a
# plain-http (.local) zone the browser would then drop the cookie and
# never be able to sign in.

proxy_http_version 1.1;

# WebSocket upgrade (kernels, terminals, the /api/kernels/*/channels
# socket).  $connection_upgrade is "upgrade" when the client sends an
# Upgrade header, else "close".
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Pass the external-facing host + scheme through to Jupyter.
proxy_set_header Host              $forwarded_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $forwarded_host;

# Don't buffer streaming responses (kernel output, long polls).
proxy_buffering off;
